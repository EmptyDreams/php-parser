import org.jreleaser.gradle.plugin.tasks.AbstractJReleaserTask

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jreleaser' version '1.25.0'
}

group = 'top.kmar.php'
version = '0.0.1'
description = 'A pure PHP 7.2 parser implemented in Java with JFlex and CUP'

def cupVersion = '1.1.0'

configurations {
    jflex
    cup
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs(
                layout.buildDirectory.dir('generated/main/jflex'),
                layout.buildDirectory.dir('generated/main/cup')
            )
        }
    }
}

dependencies {
    // JFlex 的内部解析器使用原版 CUP；其 classpath 必须与 fork 运行时隔离。
    jflex 'de.jflex:jflex:1.9.1'
    // CUP 解析器生成器（仅在生成任务中使用）
    cup "top.kmar.cup:java-cup:${cupVersion}"
    // 生成的解析器运行时依赖
    // 公共 API 暴露 AstNode、Symbol 等类型，使用者编译时也需要运行时库。
    api "top.kmar.cup:java-cup-runtime:${cupVersion}"

    compileOnly 'org.jetbrains:annotations:26.1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def cupSource = layout.projectDirectory.file('src/main/cup/php.cup')
def flexSource = layout.projectDirectory.file('src/main/jflex/php.flex')
def jflexOutputDir = layout.buildDirectory.dir('generated/main/jflex/top/kmar/php')
def cupOutputDir = layout.buildDirectory.dir('generated/main/cup/top/kmar/php')
def cupParserClass = 'PhpParser'
def cupSymbolsClass = 'PhpSymbols'

// jflex 的 -d 与 CUP 的 -destdir 都不会自动拼接包路径，需要写全
tasks.register('generateJFlexLexer', JavaExec) {
    mainClass = 'jflex.Main'
    classpath = configurations.jflex
    args = [
            '-d', jflexOutputDir.get().asFile,
            '--encoding', 'UTF-8',
            '--nobak',
            flexSource
    ]
    workingDir = project.projectDir
    inputs.file(flexSource)
    outputs.dir(jflexOutputDir)
}

tasks.register('generateCupParser', JavaExec) {
    mainClass = 'java_cup.Main'
    classpath = configurations.cup
    args = [
            '-parser', cupParserClass,
            '-symbols', cupSymbolsClass,
            '-interface',
            // 生成非终结符常量与 NON_TERMINAL_NAMES（ComplexSymbolFactory 需要）
            '-nonterms',
            // AST 模式：为每个 AstNode 类型的非终结符生成语法树节点类。
            // 用 %p（完整名称）：本文法存在 top_statement/class_statement 这类
            // 同后缀非终结符，%s 截前缀后类名会冲突
            '-ast', 'Node%p',
            // 与 php-src 一致：该文法在 bison 下是零冲突的，
            // 出现任何冲突都说明翻译有误，直接让生成失败
            '-expect', '0',
            // 压缩 reduce 表：不压缩时 _production_table 的字符串常量
            // 超过 64KB 上限，生成的 parser 无法编译（“代码过长”）
            '-compact_red',
            // 仅清理 CUP 专属输出目录，避免文法调整后残留旧节点类。
            '-auto_clear',
            '-destdir', cupOutputDir.get().asFile,
            cupSource
    ]
    workingDir = project.projectDir
    inputs.file(cupSource)
    outputs.dir(cupOutputDir)
}
// Windows 平台默认编码是 GBK，源码一律按 UTF-8 编译
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateJFlexLexer'), tasks.named('generateCupParser')
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

// 源码包包含生成的词法分析器、解析器及 AST 节点。
tasks.named('sourcesJar') {
    dependsOn tasks.named('generateJFlexLexer'), tasks.named('generateCupParser')
}

// 主包、源码包和 Javadoc 包均附带项目许可证。
tasks.withType(Jar).configureEach {
    from(layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    // 生成代码和已有注释包含非 Javadoc HTML 的文本。
    options.addBooleanOption('Xdoclint:none', true)
}

def developerId = findProperty('developerId') ?: 'kmar'
def developerName = findProperty('developerName') ?: 'kmar'
def developerEmail = findProperty('developerEmail') ?: ''

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'php-parser'

            pom {
                name = 'PHP Parser'
                description = project.description
                url = 'https://github.com/EmptyDreams/php-parser'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = developerId
                        name = developerName
                        if (developerEmail) {
                            email = developerEmail
                        }
                    }
                }

                scm {
                    url = 'https://github.com/EmptyDreams/php-parser'
                    connection = 'scm:git:git://github.com/EmptyDreams/php-parser.git'
                    developerConnection = 'scm:git:ssh://git@github.com/EmptyDreams/php-parser.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'jreleaserStaging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// 与 CUP fork 一致：Gradle 暂存产物，JReleaser 签名并提交 Central Publisher Portal。
// 凭据与签名密钥通过环境变量或 ~/.jreleaser/config.toml 提供。
jreleaser {
    project {
        license = 'MIT'
    }

    signing {
        pgp {
            active = 'RELEASE'
            armored = true
        }
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }

    release {
        github {
            enabled = true
            repoOwner = 'EmptyDreams'
            name = 'php-parser'
        }
    }
}

tasks.withType(AbstractJReleaserTask).configureEach {
    doNotTrackState('JReleaser manages trace.log and conflicts with Gradle output cleanup on Windows')
}
